<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - My Case Diary</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card center">
            <div class="flex-between">
                <h2>Login - My Case Diar</h2>
                <button id="themeToggle" class="theme-toggle" onclick="toggleTheme()">🌙</button>
            </div>
            <form id="signinForm">
                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <input type="text" id="mobile" required placeholder="Enter Mobile Number">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Enter Password">
                </div>
                <button type="submit" class="btn btn-block">Sign In</button>
            </form>
            <p style="margin-top: 15px; font-size: 14px;">Don't have an account? <a href="signup.html">Sign Up</a></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
