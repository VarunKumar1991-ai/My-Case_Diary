<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Case</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="flex-between" style="margin-bottom: 20px;">
                <h2>New Case</h2>
                <button id="themeToggle" class="theme-toggle" onclick="toggleTheme()">🌙</button>
            </div>
            <form id="caseForm">
                <div class="form-group">
                    <label for="title">Case Title</label>
                    <input type="text" id="title" required placeholder="Case Title">
                </div>
                <div class="form-group">
                    <label for="number">Case Number</label>
                    <input type="text" id="number" required placeholder="Case Number">
                </div>
                <div class="form-group flex-between" style="margin-bottom: 5px;">
                    <label for="description" style="margin-bottom: 0;">Description</label>
                    <select id="writingModeSelect" style="width: auto; padding: 4px; font-size: 12px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color);">
                        <option value="default">Default</option>
                        <option value="dark">Dark</option>
                        <option value="terminal">Terminal</option>
                        <option value="comfort">Eye Comfort</option>
                    </select>
                </div>
                <div class="form-group">
                    <textarea id="description" required placeholder="Detailed description of the case..."></textarea>
                </div>
                <div style="display:flex; gap:10px;">
                    <button type="submit" class="btn">Save Case</button>
                    <a href="dashboard.html" class="btn" style="background:transparent; color:var(--text-color); border-color:var(--border-color);">Cancel</a>
                </div>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
